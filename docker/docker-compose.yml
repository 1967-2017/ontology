version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ontology-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ontology
      MYSQL_USER: ontology
      MYSQL_PASSWORD: ontology
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  neo4j:
    image: neo4j:5.25
    container_name: ontology-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/ontology123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
